[project]
name = "ai-enginner-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Utkarsh Goyal", email = "utogoyal.ug@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.165.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.24",
    "psycopg>=3.3.9",
    "pydantic>=2.14.4",
    "sqlalchemy>=2.1.9",
    "typing>=3.10.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-enginner-backend = "ai_enginner_backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
